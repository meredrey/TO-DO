<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tasks">
<title>Task Manager</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%238a6b7e'/><text y='.85em' font-size='68' x='50%25' text-anchor='middle' font-family='system-ui'>✦</text></svg>">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#ffffff;min-height:100vh}
input,select,button,textarea{font-family:'DM Sans',sans-serif}
:root{
  --sage:#6b9478;--sage-l:#e8f0eb;--sage-d:#3d6b50;
  --mauve:#8a6b7e;--mauve-l:#f2edf0;
  --rose:#a07070;--rose-l:#f5ecec;
  --amber:#9e7e4a;--amber-l:#f5eddf;
  --lavender:#7a6e9e;--lavender-l:#eeeaf5;
  --text:#1a1a18;--text2:#6b6b65;--text3:#b0b0aa;
  --bg:#ffffff;--bg2:#f8f7f5;--bg3:#f2f1ef;
  --bd:rgba(0,0,0,.06);--bd2:rgba(0,0,0,.12);
  --urgent:#c04040;--urgent-l:#fef2f2;
  --important:#5e8e5e;--important-l:#f2f7f2;
  --shadow:0 2px 12px rgba(0,0,0,.06);
  --shadow-hover:0 4px 20px rgba(0,0,0,.1);
}

/* ── LAYOUT ── */
.app{max-width:430px;margin:0 auto;padding:0 0 120px;background:#ffffff;min-height:100vh}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:max(env(safe-area-inset-top),20px) 20px 0}
.topbar h1{font-size:22px;font-weight:600;color:var(--text)}
.topbar-sub{font-size:12px;color:var(--text3);margin-top:2px}
.icon-btn{width:38px;height:38px;border-radius:50%;border:.5px solid var(--bd2);background:var(--bg2);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2);transition:all .15s}
.icon-btn:hover{background:var(--bg3)}
.icon-btn svg{width:16px;height:16px}

/* ── NAV ── */
.nav{display:flex;margin:16px 20px 0;background:var(--bg2);border-radius:14px;padding:4px;border:.5px solid var(--bd)}
.nav-btn{flex:1;padding:9px 0;border:none;background:transparent;border-radius:10px;font-size:13px;font-weight:500;color:var(--text3);cursor:pointer;transition:all .2s;text-align:center}
.nav-btn.active{background:#ffffff;color:var(--text);box-shadow:var(--shadow);font-weight:600}

/* ── TABS ── */
.tab{display:none;padding:16px 20px 0}
.tab.active{display:block}

/* ── SECTION LABELS ── */
.section-label{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin:20px 0 10px}

/* ── TODAY LAYOUT ── */
.today-cols{display:flex;flex-direction:column;gap:0;margin-top:6px}
.today-col-label{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.recurring-strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px;scrollbar-width:none;-ms-overflow-style:none}
.recurring-strip::-webkit-scrollbar{display:none}
.recur-tile{background:#ffffff;border:.5px solid var(--bd);border-radius:14px;padding:10px 12px;flex-shrink:0;width:140px;box-shadow:var(--shadow);cursor:pointer;border-left:3px solid var(--lavender)}
.recur-tile-name{font-size:13px;font-weight:500;color:var(--text);margin-bottom:6px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.recur-tile-meta{display:flex;align-items:center;gap:4px;flex-wrap:wrap}

/* ── TASK CARD ── */
.task-card{background:#ffffff;border:.5px solid var(--bd);border-radius:18px;margin-bottom:10px;overflow:hidden;transition:all .2s;box-shadow:var(--shadow)}
.task-card:hover{box-shadow:var(--shadow-hover);border-color:var(--bd2);transform:translateY(-1px)}
.task-card.priority-urgent{border-left:3px solid var(--urgent);border-radius:18px}
.task-card.priority-important{border-left:3px solid var(--important);border-radius:18px}
.task-card.done-card{opacity:.45;box-shadow:none}
.task-main{padding:14px 16px;display:flex;align-items:flex-start;gap:12px;cursor:pointer}
.task-check{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--bd2);flex-shrink:0;margin-top:1px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.task-check.done{background:var(--sage);border-color:var(--sage)}
.task-check.done svg{opacity:1}
.task-check svg{width:10px;height:10px;opacity:0}
.task-body{flex:1;min-width:0}
.task-name{font-size:14px;font-weight:500;color:var(--text);line-height:1.35;margin-bottom:4px}
.task-name.done{text-decoration:line-through;color:var(--text3)}
.task-chips{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:5px}
.chip{display:inline-flex;align-items:center;font-size:11px;padding:3px 9px;border-radius:20px;font-weight:500;border:.5px solid transparent;letter-spacing:.01em}
.chip-client{background:var(--bg2);color:var(--text2);border-color:var(--bd)}
.chip-urgent{background:var(--urgent-l);color:var(--urgent);border-color:rgba(192,64,64,.15)}
.chip-important{background:var(--important-l);color:var(--important);border-color:rgba(94,142,94,.15)}
.chip-date{background:var(--bg2);color:var(--text2);border-color:var(--bd)}
.chip-date.overdue{background:var(--urgent-l);color:var(--urgent);border-color:rgba(192,64,64,.15)}
.chip-recur{background:var(--lavender-l);color:var(--lavender);border-color:rgba(122,110,158,.15)}
.chip-blocked{background:var(--amber-l);color:var(--amber);border-color:rgba(158,126,74,.15)}
.task-expand-btn{background:none;border:none;cursor:pointer;color:var(--text3);padding:4px;flex-shrink:0;display:flex;align-items:center}
.task-expand-btn svg{width:14px;height:14px;transition:transform .2s}
.task-expand-btn.open svg{transform:rotate(180deg)}

/* ── DETAIL ── */
.task-detail{display:none;border-top:.5px solid var(--bd);background:var(--bg2);border-radius:0 0 18px 18px}
.task-detail.open{display:block}
.det-name-inp{width:100%;padding:10px 14px;border:none;background:transparent;font-size:14px;font-weight:500;color:var(--text);border-bottom:.5px solid var(--bd);font-family:inherit}
.det-name-inp:focus{outline:none;background:var(--bg)}
.det-tabs{display:flex;border-bottom:.5px solid var(--bd)}
.det-tab{flex:1;padding:8px 4px;border:none;background:transparent;font-size:12px;font-weight:500;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent}
.det-tab.active{color:var(--sage);border-bottom-color:var(--sage)}
.det-panel{display:none;padding:12px 14px}
.det-panel.active{display:block}

/* ── QUICK CONTROLS ── */
.qc-row{display:flex;flex-wrap:wrap;gap:5px;padding:8px 14px;border-top:.5px solid var(--bd)}
.qc-btn{padding:5px 10px;border:.5px solid var(--bd2);border-radius:20px;background:var(--bg);font-size:11px;font-weight:500;cursor:pointer;color:var(--text2);transition:all .15s;font-family:inherit;white-space:nowrap}
.qc-btn.active-urgent{background:var(--urgent-l);border-color:var(--urgent);color:var(--urgent)}
.qc-btn.active-important{background:var(--important-l);border-color:var(--important);color:var(--important)}
.qc-btn.active-recur{background:var(--lavender-l);border-color:var(--lavender);color:var(--lavender)}
.qc-btn.active-block{background:var(--amber-l);border-color:var(--amber);color:var(--amber)}

/* ── POPOVER ── */
.popover{background:var(--bg);border:.5px solid var(--bd2);border-radius:14px;padding:12px 14px;box-shadow:0 4px 20px rgba(0,0,0,.1);margin:4px 0 8px}
.pop-title{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.pop-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.pop-btn{padding:6px 12px;border:.5px solid var(--bd2);border-radius:20px;background:var(--bg2);font-size:12px;font-weight:500;cursor:pointer;color:var(--text2);transition:all .15s;font-family:inherit}
.pop-btn.sel{background:var(--sage-l);border-color:var(--sage);color:var(--sage-d)}
.pop-btn.sel-u{background:var(--urgent-l);border-color:var(--urgent);color:var(--urgent)}
.pop-btn.sel-i{background:var(--important-l);border-color:var(--important);color:var(--important)}
.pop-inp{width:100%;padding:8px 10px;border:.5px solid var(--bd2);border-radius:8px;background:var(--bg);color:var(--text);font-size:13px;font-family:inherit;margin-bottom:8px}
.pop-inp:focus{outline:none;border-color:var(--sage)}
.pop-close{font-size:11px;color:var(--text3);cursor:pointer;display:block;text-align:right;margin-top:4px}

/* ── SUBTASKS ── */
.sub-item{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:.5px solid var(--bd)}
.sub-item:last-child{border-bottom:none}
.sub-check{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--bd2);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.sub-check.done{background:var(--sage);border-color:var(--sage)}
.sub-check svg{width:8px;height:8px;opacity:0}
.sub-check.done svg{opacity:1}
.sub-name{flex:1;font-size:13px;color:var(--text)}
.sub-name.done{text-decoration:line-through;color:var(--text3)}
.sub-del{background:none;border:none;cursor:pointer;color:var(--text3);font-size:14px;padding:0 2px}
.add-sub-row{display:flex;gap:6px;margin-top:8px}
.add-sub-inp{flex:1;padding:7px 10px;border:.5px solid var(--bd2);border-radius:8px;background:var(--bg);color:var(--text);font-size:13px;font-family:inherit}
.add-sub-inp:focus{outline:none;border-color:var(--sage)}
.add-sub-btn{padding:7px 12px;background:var(--sage);color:white;border:none;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer}

/* ── NOTE ── */
.note-area{width:100%;padding:8px 0;border:none;background:transparent;font-size:13px;color:var(--text);resize:none;font-family:inherit;min-height:80px}
.note-area:focus{outline:none}

/* ── PROGRESS BAR (subtasks) ── */
.sub-prog{display:flex;align-items:center;gap:6px;margin-top:4px}
.sub-prog-track{flex:1;height:3px;background:var(--bd);border-radius:2px;overflow:hidden}
.sub-prog-fill{height:100%;background:var(--sage);border-radius:2px;transition:width .3s}
.sub-prog-txt{font-size:10px;color:var(--text3)}

/* ── BLOCKED GROUP ── */
.block-group{background:var(--amber-l);border:.5px solid var(--amber);border-radius:12px;padding:10px 14px;margin-bottom:8px}
.block-group-header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.block-group-name{font-size:13px;font-weight:500;color:var(--amber);flex:1}
.block-group-unlock{padding:4px 10px;background:var(--amber);color:white;border:none;border-radius:8px;font-size:11px;font-weight:500;cursor:pointer;font-family:inherit}
.block-group-task{font-size:12px;color:var(--text2);padding:3px 0;display:flex;align-items:center;gap:6px}

/* ── FORM / MODAL ── */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;align-items:flex-end}
.overlay.open{display:flex}
.sheet{background:#ffffff;border-radius:24px 24px 0 0;padding:20px 24px max(env(safe-area-inset-bottom),24px);width:100%;max-height:92vh;overflow-y:auto;box-shadow:0 -4px 40px rgba(0,0,0,.12)}
.sheet-handle{width:36px;height:4px;background:var(--bd2);border-radius:2px;margin:0 auto 16px}
.sheet-title{font-size:17px;font-weight:600;color:var(--text);margin-bottom:16px}
.form-group{margin-bottom:12px}
.form-label{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:5px}
.form-input{width:100%;padding:10px 12px;border:.5px solid var(--bd2);border-radius:10px;background:var(--bg2);color:var(--text);font-size:14px;font-family:inherit}
.form-input:focus{outline:none;border-color:var(--sage);background:var(--bg)}
.prio-row{display:flex;gap:6px;margin-bottom:4px}
.prio-btn{flex:1;padding:9px 4px;border:.5px solid var(--bd);border-radius:10px;background:var(--bg2);font-size:12px;font-weight:500;cursor:pointer;text-align:center;transition:all .15s;color:var(--text2);font-family:inherit}
.prio-btn.sel-u{background:var(--urgent-l);border-color:var(--urgent);color:var(--urgent)}
.prio-btn.sel-i{background:var(--important-l);border-color:var(--important);color:var(--important)}
.prio-btn.sel-n{background:var(--bg2);border-color:var(--bd2);color:var(--text2)}
.quick-date-row{display:flex;gap:5px;margin-bottom:6px}
.qd-btn{flex:1;padding:7px 4px;border:.5px solid var(--bd2);border-radius:8px;background:var(--bg2);font-size:12px;cursor:pointer;color:var(--text2);text-align:center;font-family:inherit;transition:all .15s}
.qd-btn.active{background:var(--sage-l);border-color:var(--sage);color:var(--sage-d)}
.more-toggle{font-size:12px;color:var(--sage);cursor:pointer;text-decoration:underline;text-underline-offset:2px;display:block;text-align:right;margin-bottom:10px}
.more-opts{display:none}
.more-opts.open{display:block}
.recur-row{display:flex;gap:4px;flex-wrap:wrap}
.recur-btn{padding:5px 10px;border:.5px solid var(--bd);border-radius:8px;background:var(--bg2);font-size:12px;cursor:pointer;color:var(--text2);font-family:inherit;transition:all .15s}
.recur-btn.active{background:var(--lavender-l);border-color:var(--lavender);color:var(--lavender)}
.save-btn{width:100%;padding:14px;background:var(--sage);color:white;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px;font-family:inherit}

/* ── FAB ── */
.fab{position:fixed;bottom:max(env(safe-area-inset-bottom),28px);left:50%;transform:translateX(-50%);padding:16px 32px;background:var(--mauve);color:white;border:none;border-radius:50px;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 6px 24px rgba(138,107,126,.4);z-index:50;font-family:inherit;white-space:nowrap;transition:all .2s;letter-spacing:.01em}
.fab:hover{transform:translateX(-50%) translateY(-2px);box-shadow:0 8px 28px rgba(138,107,126,.5)}
.fab:active{transform:translateX(-50%) translateY(0)}

/* ── BACKLOG ── */
.filter-row{display:flex;gap:5px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;-ms-overflow-style:none}
.filter-row::-webkit-scrollbar{display:none}
.fchip{padding:7px 16px;border:.5px solid var(--bd);border-radius:20px;background:var(--bg2);font-size:12px;font-weight:500;cursor:pointer;color:var(--text2);white-space:nowrap;font-family:inherit;flex-shrink:0;transition:all .15s}
.fchip:hover{background:var(--bg3);border-color:var(--bd2)}
.fchip.active{background:var(--sage);border-color:var(--sage);color:white;box-shadow:0 2px 8px rgba(107,148,120,.25)}
.want-more-btn{width:100%;padding:14px;background:var(--bg);border:1.5px dashed var(--bd2);border-radius:12px;font-size:14px;font-weight:500;color:var(--text2);cursor:pointer;margin-top:8px;font-family:inherit}

/* ── SETTINGS ── */
.settings-section{margin-bottom:20px}
.settings-title{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:.5px solid var(--bd)}
.settings-row:last-child{border-bottom:none}
.settings-row-label{font-size:14px;font-weight:500;color:var(--text)}
.settings-row-sub{font-size:12px;color:var(--text3);margin-top:1px}
.tact-btn{padding:7px 14px;border:.5px solid var(--bd2);border-radius:8px;background:var(--bg2);font-size:12px;font-weight:500;cursor:pointer;color:var(--text);font-family:inherit}
.tact-btn.primary{background:var(--sage);border-color:var(--sage);color:white}
.tact-btn.danger{background:var(--rose-l);border-color:var(--rose);color:var(--rose)}
.sync-status{font-size:12px;color:var(--sage);margin-top:8px;min-height:18px}

/* ── CLIENT MANAGEMENT ── */
.client-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px 5px 12px;background:var(--bg);border:.5px solid var(--bd2);border-radius:20px;margin:4px 4px 4px 0;font-size:13px;color:var(--text)}
.client-pill-del{background:none;border:none;cursor:pointer;color:var(--text3);font-size:14px;line-height:1;padding:0}

/* ── MEETINGS ── */
.meeting-card{background:var(--bg);border:.5px solid var(--bd);border-radius:14px;margin-bottom:8px;overflow:hidden}
.meeting-head{padding:12px 14px;cursor:pointer;display:flex;align-items:center;gap:10px}
.meeting-head:hover{background:var(--bg2)}
.meeting-title{font-size:14px;font-weight:500;color:var(--text);flex:1}
.meeting-meta{font-size:12px;color:var(--text3)}
.meeting-body{display:none;border-top:.5px solid var(--bd);padding:12px 14px;background:var(--bg2)}
.meeting-body.open{display:block}
.agenda-item{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:.5px solid var(--bd);font-size:13px}
.agenda-item:last-child{border-bottom:none}
.agenda-check{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--bd2);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center}
.agenda-check.done{background:var(--sage);border-color:var(--sage)}
.agenda-del{background:none;border:none;cursor:pointer;color:var(--text3);font-size:13px;padding:0 2px;margin-left:auto}

/* ── EMPTY STATE ── */
.empty{text-align:center;padding:48px 24px;color:var(--text3)}
.empty-icon{font-size:32px;margin-bottom:12px}
.empty-title{font-size:16px;font-weight:500;color:var(--text2);margin-bottom:6px}
.empty-sub{font-size:13px}

/* ── REMEMBER ── */
.remember-card{background:var(--mauve-l);border:.5px solid var(--mauve);border-radius:12px;padding:10px 14px;margin-bottom:10px}
.remember-title{font-size:10px;font-weight:600;color:var(--mauve);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.remember-item{display:flex;align-items:flex-start;gap:8px;padding:4px 0;font-size:13px;color:var(--text);border-bottom:.5px solid rgba(138,107,126,.15)}
.remember-item:last-child{border-bottom:none}
.remember-del{background:none;border:none;cursor:pointer;color:var(--mauve);font-size:13px;padding:0 2px;flex-shrink:0;opacity:.6}
.remember-to-task{background:none;border:none;cursor:pointer;color:var(--sage);font-size:11px;font-weight:500;padding:0 4px;flex-shrink:0;font-family:inherit}
</style>
</head>
<body>
<div class="app">
  <!-- TOPBAR -->
  <div class="topbar">
    <div>
      <h1 id="topbar-title">Dzień dobry</h1>
      <div class="topbar-sub" id="topbar-date"></div>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="icon-btn" onclick="openWeeklySummary()" title="Podsumowanie tygodnia" style="font-size:16px;border:none;background:var(--bg2)">📋</button>
      <button class="icon-btn" onclick="switchTab('settings',null)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
    </div>
  </div>

  <!-- NAV -->
  <div class="nav">
    <button class="nav-btn active" onclick="switchTab('today',this)">Dziś</button>
    <button class="nav-btn" onclick="switchTab('backlog',this)">Backlog</button>
    <button class="nav-btn" onclick="switchTab('plans',this)">Plany</button>
  </div>

  <!-- TODAY -->
  <div id="tab-today" class="tab active">
    <div id="today-content"></div>

          <button class="recur-btn" onclick="setRecur('weekly',this)">Co tydzień</button>

<script>
/* ═══════════════════════════════════════════
   STORAGE
═══════════════════════════════════════════ */
const SK  = 'mata_tasks_v4';
const CK  = 'mata_clients_v2';
const CNK = 'mata_client_notes_v1';
const MeK = 'mata_meetings_v1';
const GK  = 'mata_gs_url';

const DEFAULT_GS_URL = 'https://script.google.com/macros/s/AKfycbwF4XPrLTHDPHPDvYB09GID_SL8AHqZTT6vvRkcuuLULzi4VU6kKzbY8p5h3S7G_JR-1w/exec';
let gsUrl = DEFAULT_GS_URL;
localStorage.setItem(GK, gsUrl);

let tasks       = JSON.parse(localStorage.getItem(SK)  || '[]');
let clients     = JSON.parse(localStorage.getItem(CK)  || '["Sandoz","AZ","UCB","Recipharm","Veeva","MP","Prywatne"]');
let clientNotes = JSON.parse(localStorage.getItem(CNK) || '{}');
let meetings    = JSON.parse(localStorage.getItem(MeK) || '[]');

const save   = () => localStorage.setItem(SK,  JSON.stringify(tasks));
const saveCl = () => localStorage.setItem(CK,  JSON.stringify(clients));
const saveCN = () => localStorage.setItem(CNK, JSON.stringify(clientNotes));
const saveMe = () => localStorage.setItem(MeK, JSON.stringify(meetings));

const td = () => {
  const n = new Date();
  return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');
};

/* ═══════════════════════════════════════════
   NORMALIZE (from Sheets dates)
═══════════════════════════════════════════ */
function normalizeDate(v) {
  if (!v) return null;
  if (typeof v === 'string' && v.length > 10)
    return new Date(v).toLocaleDateString('sv-SE', {timeZone:'Europe/Warsaw'});
  return v;
}

function normalizeTask(t) {
  t.dueDate     = normalizeDate(t.dueDate);
  t.dayAssigned = normalizeDate(t.dayAssigned);
  if (!t.updatedAt || typeof t.updatedAt !== 'number') t.updatedAt = 0;
  // Migrate old priority fields → new 'priority' field
  if (!t.priority) {
    const u = t.urgency||1, i = t.importance||1;
    if (u>=2 && i>=2) t.priority = 'urgent';
    else if (i>=2)    t.priority = 'important';
    else if (u>=2)    t.priority = 'urgent';
    else              t.priority = 'none';
  }
  // Recurring → scheduled
  if (t.recur && t.recur !== 'none' && t.dueDate) t.dateType = 'scheduled';
  if (t.subtasks) t.subtasks = t.subtasks.map(s => {
    s.dueDate = normalizeDate(s.dueDate);
    return s;
  });
  return t;
}

// Normalize on load
tasks = tasks.map(normalizeTask);

// Advance stale recurring tasks to today:
// If a recurring task has a past due date and was never completed,
// advance its date to today (or next valid day for weekdays)
(function advanceStaleRecurring() {
  const today = td();
  tasks.forEach(t => {
    if (t.done || !t.recur || t.recur === 'none' || !t.dueDate) return;
    if (t.dueDate >= today) return; // not stale
    // Advance to today
    let d = new Date(today + 'T00:00:00');
    if (t.recur === 'weekdays') {
      while (d.getDay() === 0 || d.getDay() === 6) d.setDate(d.getDate() + 1);
    }
    const newDate = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    t.dueDate = newDate;
    t.updatedAt = Date.now();
  });
})();

save();

/* ═══════════════════════════════════════════
   COLORS
═══════════════════════════════════════════ */
const CL_COLORS = ['#6b9478','#8a6b7e','#5e8e90','#9e7e4a','#7a6e9e','#7a8a6b','#6b7a8e','#8e6b6b'];
const clColor = cl => CL_COLORS[clients.indexOf(cl) % CL_COLORS.length] || '#6b9478';

/* ═══════════════════════════════════════════
   SYNC
═══════════════════════════════════════════ */
let syncTimer = null;

function setSyncStatus(msg, type='') {
  const el = document.getElementById('sync-status');
  if (el) { el.textContent = msg; el.style.color = type==='err' ? 'var(--rose)' : 'var(--sage)'; }
}

function scheduleAutoSync() {
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncAll, 2000);
}

async function syncAll() {
  if (!gsUrl) return;
  clearTimeout(syncTimer);
  try {
    const resp = await fetch(gsUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action: 'syncAll', tasks, clients })
    });
    const data = await resp.json();
    const ts = new Date().toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'});
    setSyncStatus(data.ok ? '✓ ' + tasks.length + ' zadań · ' + ts : 'Błąd: ' + data.error, data.ok ? 'ok' : 'err');
  } catch(e) { setSyncStatus('Błąd sync', 'err'); }
}

async function loadFromSheets() {
  if (!gsUrl) return;
  setSyncStatus('Pobieram…');
  try {
    const resp = await fetch(gsUrl + '?action=getAll');
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    if (data.error) throw new Error(data.error);
    if (Array.isArray(data.tasks) && data.tasks.length > 0) {
      // Merge: local wins if updatedAt is newer
      const localMap = Object.fromEntries(tasks.map(t=>[t.id,t]));
      const remoteTasks = data.tasks.map(normalizeTask);
      const merged = remoteTasks.map(rt => {
        const local = localMap[rt.id];
        return (local && (local.updatedAt||0) >= (rt.updatedAt||0)) ? local : rt;
      });
      const remoteIds = new Set(remoteTasks.map(t=>t.id));
      tasks.filter(t=>!remoteIds.has(t.id)).forEach(t=>merged.push(t));
      tasks = merged;
      save();
    }
    if (Array.isArray(data.clients) && data.clients.length > 0) { clients = data.clients; saveCl(); }
    const ts = new Date().toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'});
    setSyncStatus('✓ Pobrano · ' + ts);
    renderAll();
  } catch(e) { setSyncStatus('Błąd: ' + e.message, 'err'); }
}

/* ═══════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════ */
function effectiveDueDate(t) {
  if (t.dueDate) return t.dueDate;
  const dates = (t.subtasks||[]).filter(s=>!s.done&&s.dueDate).map(s=>s.dueDate).sort();
  return dates[0] || null;
}

function effectivePriority(t) {
  const base = t.priority || 'none';
  const edd = effectiveDueDate(t);
  if (!edd) return base;

  const today = td();
  const in3days = new Date(Date.now() + 3*24*60*60*1000).toISOString().split('T')[0];

  // Scheduled (exact day) → urgent on that day
  if (t.dateType === 'scheduled' && edd === today) return 'urgent';

  // Deadline → urgent if 3 days or less away; important if further
  if (t.dateType !== 'scheduled') {
    if (edd <= today)    return 'urgent';  // overdue = urgent
    if (edd <= in3days)  return 'urgent';  // within 3 days = urgent
    // further away: escalate none→important, keep urgent/important
    if (base === 'none') return 'important';
  }

  return base;
}

function isVisibleToday(t) {
  if (t.done || t.status === 'waiting') return false;
  const edd = effectiveDueDate(t);
  if (t.dateType === 'scheduled') return !edd || edd <= td();
  return !edd || edd <= td();
}

function isRecurring(t) { return t.recur && t.recur !== 'none'; }

/* ═══════════════════════════════════════════
   RENDER ALL
═══════════════════════════════════════════ */
function renderAll() {
  renderToday();
  renderBacklog();
  renderPlans();
  renderSettings();
  updateTopbar();
}

function updateTopbar() {
  const days = ['Niedziela','Poniedziałek','Wtorek','Środa','Czwartek','Piątek','Sobota'];
  const now = new Date();
  document.getElementById('topbar-title').textContent = getGreeting();
  document.getElementById('topbar-date').textContent = days[now.getDay()] + ', ' +
    now.toLocaleDateString('pl-PL',{day:'numeric',month:'long'});
}

function getGreeting() {
  const h = new Date().getHours();
  if (h < 12) return 'Dzień dobry';
  if (h < 18) return 'Dobry wieczór';
  return 'Dobranoc';
}

/* ═══════════════════════════════════════════
   RENDER TODAY
═══════════════════════════════════════════ */
function renderToday() {
  const today = td();
  const active = tasks.filter(t => !t.done && t.status !== 'waiting');

  // Recurring tasks for today
  const recurring = active.filter(t => isRecurring(t) && isVisibleToday(t));

  // One-time tasks visible today
  const oneTime = active.filter(t => !isRecurring(t) && isVisibleToday(t));
  const urgent    = oneTime.filter(t => effectivePriority(t) === 'urgent').sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
  const important = oneTime.filter(t => effectivePriority(t) === 'important').sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
  const remember  = oneTime.filter(t => effectivePriority(t) === 'none');

  // Max 3: up to 2 urgent + 1 oldest important
  const dayTasks = [...urgent.slice(0,2), ...important.slice(0,1)];
  // If fewer than 2 urgent, fill with more important
  if(urgent.length < 2) {
    const extraImportant = important.slice(1, 3 - urgent.length);
    dayTasks.push(...extraImportant);
  }
  const allDone = dayTasks.length > 0 && dayTasks.every(t => t.done);
  const showWantMore = allDone && remember.length > 0;

  // Done tasks (completed today)
  const doneTasks = tasks.filter(t => t.done && t.updatedAt && 
    new Date(t.updatedAt).toLocaleDateString('sv-SE') === today);

  // Blocked groups
  const blocked = tasks.filter(t => !t.done && t.status === 'waiting');

  let html = '';

  // Recurring strip (horizontal scroll)
  if (recurring.length > 0) {
    html += '<div class="today-col-label">↻ Cykliczne</div>';
    html += '<div class="recurring-strip">';
    html += recurring.map(t => {
      const edd = effectiveDueDate(t);
      const ep = effectivePriority(t);
      const cc = clColor(t.client);
      const overdue = edd && edd < td();
      return `<div class="recur-tile${ep==='urgent'?' priority-urgent':''}" onclick="toggleExpand('${t.id}',event)">
        <div class="task-check${t.done?' done':''}" onclick="event.stopPropagation();toggleDone('${t.id}')" style="width:18px;height:18px;border-radius:50%;border:1.5px solid var(--bd2);display:flex;align-items:center;justify-content:center;margin-bottom:6px;cursor:pointer${t.done?';background:var(--sage);border-color:var(--sage)':''}">
          <svg viewBox="0 0 10 10" fill="none" stroke="white" stroke-width="2" width="10" height="10"><polyline points="1.5,5 4,7.5 8.5,2.5"/></svg>
        </div>
        <div class="recur-tile-name${t.done?' done':''}" style="${t.done?'text-decoration:line-through;color:var(--text3)':''}">${t.name}</div>
        <div class="recur-tile-meta">
          <span class="chip chip-client" style="font-size:10px;padding:2px 6px;background:${cc}15;color:${cc};border-color:${cc}30">${t.client||'–'}</span>
          ${edd?`<span class="chip chip-date${overdue?' overdue':''}" style="font-size:10px;padding:2px 6px">${overdue?'! ':''}${edd}</span>`:''}
        </div>
        ${taskDetail(t)}
      </div>`;
    }).join('');
    html += '</div>';
  }

  // One-time tasks
  html += '<div class="today-col-label">Zadania dnia</div>';
  html += dayTasks.map(t => taskCardSmall(t)).join('');

  // Always show "want more" if day slots not full or all done
  const hasBacklog = tasks.some(t => !t.done && t.status !== 'waiting' && !isRecurring(t));
  const slotsLeft = 3 - dayTasks.filter(t => !t.done).length;
  const showWantMoreBtn = hasBacklog && (dayTasks.length < 3 || allDone);

  if (dayTasks.length === 0 && !hasBacklog) {
    html += '<div style="font-size:13px;color:var(--text3);padding:16px 0;text-align:center">Backlog pusty 🎉</div>';
  }
  if (showWantMoreBtn) {
    html += `<button class="want-more-btn" onclick="openWantMore()">
      ${dayTasks.length === 0 ? '✦ Wybierz zadania na dziś' : '+ Dodaj kolejne zadanie'}
    </button>`;
  }

  // Blocked
  if (blocked.length > 0) {
    html += '<div class="section-label">⏳ Zablokowane</div>';
    html += renderBlockedGroups(blocked);
  }

  // Done today
  if (doneTasks.length > 0) {
    html += `<div class="section-label" style="margin-top:16px">✓ Zrobione dziś (${doneTasks.length})</div>`;
    html += doneTasks.map(t => taskCardSmall(t)).join('');
  }

  document.getElementById('today-content').innerHTML = html;
}

function renderBlockedGroups(blocked) {
  // Group by blockGroup or show individually
  const groups = {};
  const ungrouped = [];
  blocked.forEach(t => {
    if (t.blockGroup) {
      if (!groups[t.blockGroup]) groups[t.blockGroup] = [];
      groups[t.blockGroup].push(t);
    } else {
      ungrouped.push(t);
    }
  });

  let html = '';
  Object.entries(groups).forEach(([name, gtasks]) => {
    html += `<div class="block-group">
      <div class="block-group-header">
        <div class="block-group-name">⏳ ${name}</div>
        <button class="block-group-unlock" onclick="unlockGroup('${name.replace(/'/g,"\\'")}')">Odblokuj wszystkie</button>
      </div>
      ${gtasks.map(t=>`<div class="block-group-task">
        <span style="width:6px;height:6px;border-radius:50%;background:var(--amber);flex-shrink:0;display:inline-block"></span>
        ${t.name}
        <button onclick="unlockTask('${t.id}')" style="margin-left:auto;background:none;border:none;cursor:pointer;color:var(--text3);font-size:11px;font-family:inherit">Odblokuj</button>
      </div>`).join('')}
    </div>`;
  });

  ungrouped.forEach(t => {
    const waitLabel = t.waitingFor || '?';
    html += `<div class="block-group">
      <div class="block-group-header">
        <div style="flex:1">
          <div style="font-size:13px;font-weight:500;color:var(--text)">${t.name}</div>
          <div style="font-size:11px;color:var(--amber);margin-top:2px">⏳ ${waitLabel}</div>
        </div>
        <button class="block-group-unlock" onclick="unlockTask('${t.id}')">Odblokuj</button>
      </div>
    </div>`;
  });

  return html;
}

/* ── Small task card for Today ── */
function taskCardSmall(t) {
  const edd = effectiveDueDate(t);
  const today = td();
  const overdue = edd && edd < today;
  const cc = clColor(t.client);
  const sp = t.subtasks?.length ? t.subtasks.filter(s=>s.done).length + '/' + t.subtasks.length : '';
  const ep = effectivePriority(t);
  const prioCls = ep==='urgent'?'priority-urgent':ep==='important'?'priority-important':'';

  return `<div class="task-card ${prioCls}${t.done?' done-card':''}" id="tc-${t.id}">
    <div class="task-main">
      <div class="task-check${t.done?' done':''}" onclick="event.stopPropagation();toggleDone('${t.id}')">
        <svg viewBox="0 0 10 10" fill="none" stroke="white" stroke-width="2"><polyline points="1.5,5 4,7.5 8.5,2.5"/></svg>
      </div>
      <div class="task-body">
        <div class="task-name${t.done?' done':''}">${t.name}</div>
        <div class="task-chips">
          <span class="chip chip-client" style="background:${cc}18;color:${cc};border-color:${cc}40">${t.client||'–'}</span>
          ${ep==='urgent'?'<span class="chip chip-urgent">Pilne</span>':''}
          ${ep==='important'?'<span class="chip chip-important">Ważne</span>':''}
          ${edd?`<span class="chip chip-date${overdue?' overdue':''}">${overdue?'! ':''}${edd}</span>`:''}
          ${isRecurring(t)?`<span class="chip chip-recur">↻</span>`:''}
          ${sp?`<div class="sub-prog" style="margin-top:4px"><div class="sub-prog-track"><div class="sub-prog-fill" style="width:${Math.round(t.subtasks.filter(s=>s.done).length/t.subtasks.length*100)}%"></div></div><span class="sub-prog-txt">${sp}</span></div>`:''}
        </div>
      </div>
      <button class="task-expand-btn" id="exp-${t.id}" data-tid="${t.id}" onclick="event.stopPropagation();doExpandBtn(this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
    </div>
    ${taskDetail(t)}
  </div>`;
}

/* ── Full task card for Backlog ── */
function taskCard(t, showAdd=false) {
  return taskCardSmall(t); // same for now, add button handled separately
}

/* ═══════════════════════════════════════════
   RENDER BACKLOG
═══════════════════════════════════════════ */
let backlogFilter = 'all';

function renderBacklog() {
  // Filter chips
  document.getElementById('backlog-filter').innerHTML =
    ['all',...clients,'__done__'].map(cl => {
      const label = cl==='all'?'Wszystkie':cl==='__done__'?'✓ Ukończone':cl;
      return `<button class="fchip${backlogFilter===cl?' active':''}" onclick="setBacklogFilter('${cl}')">${label}</button>`;
    }).join('');

  let filtered = tasks;
  if (backlogFilter === '__done__') {
    const cutoff = Date.now() - 7*24*60*60*1000;
    filtered = tasks.filter(t => t.done && (t.updatedAt||0) >= cutoff)
      .sort((a,b) => (b.updatedAt||0)-(a.updatedAt||0));
  } else {
    if (backlogFilter !== 'all') filtered = filtered.filter(t => t.client===backlogFilter);
    filtered = filtered.filter(t => !t.done).sort((a,b) => {
      const pp = {urgent:2,important:1,none:0};
      return (pp[b.priority]||0) - (pp[a.priority]||0);
    });
  }

  const el = document.getElementById('backlog-content');
  if (!filtered.length) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">◈</div><div class="empty-title">Brak zadań</div></div>';
    return;
  }

  if (backlogFilter === '__done__') {
    el.innerHTML = filtered.map(t => `
      <div style="background:var(--bg);border:.5px solid var(--bd);border-radius:12px;padding:10px 14px;margin-bottom:7px;display:flex;align-items:center;gap:10px;opacity:.7">
        <div style="flex:1">
          <div style="font-size:14px;font-weight:500;color:var(--text2);text-decoration:line-through">${t.name}</div>
          <div style="font-size:11px;color:var(--text3)">${t.client||''}</div>
        </div>
        <button onclick="restoreTask('${t.id}')" class="tact-btn">↩ Przywróć</button>
      </div>`).join('');
    return;
  }

  el.innerHTML = filtered.map(t => taskCard(t)).join('');


}

function setBacklogFilter(f) {
  backlogFilter = f;
  renderBacklog();
}

/* ═══════════════════════════════════════════
   RENDER PLANS
═══════════════════════════════════════════ */
let plansTab = 'tasks';

function switchPlansTab(tab, btn) {
  plansTab = tab;
  document.getElementById('plans-tasks-content').style.display = tab==='tasks'?'block':'none';
  document.getElementById('plans-meetings-content').style.display = tab==='meetings'?'block':'none';
  document.querySelectorAll('#tab-plans .nav-btn').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  if(tab==='meetings') renderMeetings();
  else renderPlansTasks();
}

function renderPlans() {
  renderPlansTasks();
  if (plansTab==='meetings') renderMeetings();
}

function renderPlansTasks() {
  const today = td();
  const nextWeek = new Date(Date.now()+7*24*60*60*1000).toISOString().split('T')[0];

  const future = tasks.filter(t => {
    if (t.done || t.status==='waiting') return false;
    const edd = effectiveDueDate(t);
    return edd && edd > today;
  }).sort((a,b) => (effectiveDueDate(a)||'').localeCompare(effectiveDueDate(b)||''));

  if (!future.length) {
    document.getElementById('plans-tasks-content').innerHTML =
      '<div class="empty"><div class="empty-icon">◈</div><div class="empty-title">Brak zaplanowanych</div></div>';
    return;
  }

  const byDate = {};
  future.forEach(t => {
    const d = effectiveDueDate(t);
    if (!byDate[d]) byDate[d]=[];
    byDate[d].push(t);
  });

  let html = '';
  Object.entries(byDate).forEach(([date, dtasks]) => {
    const d = new Date(date+'T00:00:00');
    const label = d.toLocaleDateString('pl-PL',{weekday:'short',day:'numeric',month:'short'});
    const isThisWeek = date <= nextWeek;
    html += `<div style="font-size:11px;font-weight:600;color:${isThisWeek?'var(--sage)':'var(--text3)'};margin:12px 0 6px;text-transform:uppercase;letter-spacing:.04em">${label.toUpperCase()}</div>`;
    html += dtasks.map(t => taskCard(t)).join('');
  });

  document.getElementById('plans-tasks-content').innerHTML = html;

  future.forEach(t => {
    const inp = document.getElementById('det-name-'+t.id);
    if (inp) inp.value = t.name;
  });
}

        <div style="flex:1">

          <div class="meeting-meta">${m.date}${m.client?' · '+m.client:''}${m.agenda?.length?' · '+(m.agenda.filter(a=>a.done).length)+'/'+m.agenda.length:''}</div>
        </div>
        <button class="tact-btn danger" style="font-size:11px;padding:3px 8px" onclick="event.stopPropagation();deleteMeeting(${idx})">Usuń</button>
      </div>
      <div class="meeting-body" id="mb-${idx}">
        <div style="font-size:11px;font-weight:600;color:var(--text3);margin-bottom:8px">AGENDA</div>
        <div id="agenda-${idx}">
          ${(m.agenda||[]).map((a,ai)=>`<div class="agenda-item">
            <div class="agenda-check${a.done?' done':''}" onclick="toggleAgenda(${idx},${ai})">
              <svg viewBox="0 0 10 10" fill="none" stroke="white" stroke-width="2" width="8" height="8"><polyline points="1.5,5 4,7.5 8.5,2.5"/></svg>

/* ═══════════════════════════════════════════
   TASK INTERACTIONS
═══════════════════════════════════════════ */
function toggleDone(id) {
  const t = tasks.find(t=>t.id===id);
  if(!t) return;
  const wasDone = t.done;
  t.done = !t.done;
  t.updatedAt = Date.now();

  if(!wasDone && isRecurring(t) && t.dueDate) {
    const next = Object.assign({},t,{
      id: Date.now().toString(36)+Math.random().toString(36).slice(2,5),
      done:false, dueDate:nextRecurDate(t), dayAssigned:null,
      subtasks:(t.subtasks||[]).map(s=>Object.assign({},s,{done:false})),
      createdAt:Date.now(), updatedAt:Date.now()
    });
    tasks.push(next);
  }

  save(); scheduleAutoSync(); renderAll();
}

function nextRecurDate(t) {
  const [y,mo,d] = t.dueDate.split('-').map(Number);
  const date = new Date(y,mo-1,d);
  if(t.recur==='daily')         date.setDate(date.getDate()+1);
  else if(t.recur==='weekdays') {date.setDate(date.getDate()+1);while(date.getDay()===0||date.getDay()===6)date.setDate(date.getDate()+1);}
  else if(t.recur==='weekly')   date.setDate(date.getDate()+7);
  else if(t.recur==='monthly')  date.setMonth(date.getMonth()+1);
  return date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0');
}

function deleteTask(id) {
  if(!confirm('Usunąć zadanie?')) return;
  tasks=tasks.filter(t=>t.id!==id); save(); scheduleAutoSync(); renderAll();
}

function restoreTask(id) {
  const t=tasks.find(t=>t.id===id);
  if(!t) return;
  t.done=false; t.updatedAt=Date.now();
  save(); scheduleAutoSync(); renderAll();
}

function unlockTask(id) {
  const t=tasks.find(t=>t.id===id);
  if(!t) return;
  t.status='todo'; t.waitingFor=null; t.blockGroup=null; t.updatedAt=Date.now();
  save(); scheduleAutoSync(); renderAll();
}

function unlockGroup(name) {
  tasks.filter(t=>t.blockGroup===name).forEach(t=>{
    t.status='todo'; t.waitingFor=null; t.blockGroup=null; t.updatedAt=Date.now();
  });
  save(); scheduleAutoSync(); renderAll();
}

function inlineSave(id, field, value) {
  const t=tasks.find(t=>t.id===id);
  if(!t||!value?.trim()) return;
  t[field]=value.trim(); t.updatedAt=Date.now();
  save(); scheduleAutoSync();
  if(field==='name'){
    const nameEl=document.querySelector('#tc-'+id+' .task-name');
    if(nameEl) nameEl.textContent=value.trim();
  }
}

/* ═══════════════════════════════════════════
   EXPAND / DETAIL
═══════════════════════════════════════════ */
let _weekOffset = 0; // 0 = current week, -1 = last week, etc.

function getWeekRange(offset) {
  const now = new Date();
  const day = now.getDay();
  const diffToMon = (day === 0) ? -6 : 1 - day;
  const mon = new Date(now);
  mon.setDate(now.getDate() + diffToMon + (offset * 7));
  mon.setHours(0,0,0,0);
  const fri = new Date(mon);
  fri.setDate(mon.getDate() + 4);
  fri.setHours(23,59,59,999);
  return { mon, fri };
}

function openWeeklySummary() {
  _weekOffset = 0;
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.style.display = 'flex';
  overlay.id = 'weekly-overlay';
  overlay.onclick = e => { if(e.target===overlay) overlay.remove(); };
  document.body.appendChild(overlay);
  renderWeeklySummary();
}

function shiftWeek(delta) {
  _weekOffset += delta;
  renderWeeklySummary();
}

function renderWeeklySummary() {
  const overlay = document.getElementById('weekly-overlay');
  if (!overlay) return;

  const { mon, fri } = getWeekRange(_weekOffset);
  const weekLabel = mon.toLocaleDateString('pl-PL',{day:'numeric',month:'long'}) + ' – ' + fri.toLocaleDateString('pl-PL',{day:'numeric',month:'long',year:'numeric'});
  const relLabel = _weekOffset === 0 ? 'Ten tydzień' : _weekOffset === -1 ? 'Poprzedni tydzień' : _weekOffset < 0 ? Math.abs(_weekOffset) + ' tyg. temu' : 'Za ' + _weekOffset + ' tyg.';

  const doneTasks = tasks.filter(t => {
    if (!t.done) return false;
    const upd = new Date(t.updatedAt||0);
    return upd >= mon && upd <= fri;
  });

  const byClient = {};
  doneTasks.forEach(t => {
    const cl = t.client || 'Bez projektu';
    if (!byClient[cl]) byClient[cl] = [];
    byClient[cl].push(t);
  });

  const clientOptions = (sel) => {
    let opts = '<option value="">Bez projektu</option>';
    clients.forEach(c => {
      opts += '<option value="' + c + '"' + (c === sel ? ' selected' : '') + '>' + c + '</option>';
    });
    return opts;
  };

  const clientSections = Object.entries(byClient).map(([cl, ctasks]) => {
    const cc = clColor(cl);
    return `<div style="margin-bottom:20px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
        <span style="width:10px;height:10px;border-radius:50%;background:${cc};flex-shrink:0;display:inline-block"></span>
        <span style="font-size:13px;font-weight:600;color:var(--text)">${cl}</span>
        <span style="font-size:11px;color:var(--text3);margin-left:auto">${ctasks.length} zadań</span>
      </div>
      ${ctasks.map(t => `<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:.5px solid var(--bd)">
        <span style="color:var(--sage);flex-shrink:0">✓</span>
        <span style="font-size:13px;color:var(--text2);flex:1;line-height:1.4">${t.name}</span>
        <select onchange="reassignClient('${t.id}',this.value)" style="font-size:11px;padding:3px 6px;border:.5px solid var(--bd2);border-radius:6px;background:var(--bg2);color:var(--text2);font-family:inherit;max-width:110px;flex-shrink:0">
          ${clientOptions(t.client)}
        </select>
      </div>`).join('')}
    </div>`;
  }).join('');

  window._weeklyCopyText = Object.entries(byClient).map(([cl, ctasks]) => cl + ':\n' + ctasks.map(t => '• ' + t.name).join('\n')).join('\n\n');

  overlay.innerHTML = `<div class="sheet" style="max-height:85vh">
    <div class="sheet-handle"></div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <div class="sheet-title" style="margin-bottom:0">Podsumowanie tygodnia</div>
      <button class="tact-btn" id="weekly-copy-btn" onclick="copyWeeklySummary()">Kopiuj</button>
    </div>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:18px">
      <button class="tact-btn" onclick="shiftWeek(-1)" style="padding:6px 12px">←</button>
      <div style="flex:1;text-align:center">
        <div style="font-size:13px;font-weight:600;color:var(--text)">${relLabel}</div>
        <div style="font-size:11px;color:var(--text3)">${weekLabel}</div>
      </div>
      <button class="tact-btn" onclick="shiftWeek(1)" style="padding:6px 12px"${_weekOffset >= 0 ? ' disabled' : ''}>→</button>
    </div>
    ${doneTasks.length === 0
      ? '<div style="text-align:center;padding:32px;color:var(--text3)">Brak ukończonych zadań w tym tygodniu</div>'
      : clientSections}
    <button class="tact-btn" style="width:100%;margin-top:8px" onclick="this.closest('.overlay').remove()">Zamknij</button>
  </div>`;
}

function reassignClient(id, newClient) {
  const t = tasks.find(t => t.id === id);
  if (!t) return;
  t.client = newClient || null;
  t.updatedAt = Date.now();
  save(); scheduleAutoSync();
  renderWeeklySummary();
  renderAll();
}

function copyWeeklySummary() {
  const btn = document.getElementById('weekly-copy-btn');
  navigator.clipboard?.writeText(window._weeklyCopyText||'').then(()=>{
    if(btn){btn.textContent='Skopiowano ✓';setTimeout(()=>btn.textContent='Kopiuj',2000);}
  });
}

function doExpand(id) {
  const det=document.getElementById('det-'+id);
  const btn=document.getElementById('exp-'+id);
  if(!det) return;
  const open=!det.classList.contains('open');
  det.classList.toggle('open',open);
  btn?.classList.toggle('open',open);
}

function doExpandBtn(btn) {
  // Traverse DOM to find sibling task-detail
  const card = btn.closest('.task-card');
  if (!card) return;
  const det = card.querySelector('.task-detail');
  if (!det) return;
  const open = !det.classList.contains('open');
  det.classList.toggle('open', open);
  btn.classList.toggle('open', open);
}

function toggleExpand(id, e) {
  if(e.target.closest('.task-check,.add-sub-row,.sub-item,.note-area,.det-tab,.det-panel,.qc-row,.popover,.task-expand-btn,.task-detail')) return;
  const det=document.getElementById('det-'+id);
  const btn=document.getElementById('exp-'+id);
  const open=!det.classList.contains('open');
  det.classList.toggle('open',open);
  btn?.classList.toggle('open',open);
  if(open){
    const t=tasks.find(t=>t.id===id);
    const inp=document.getElementById('det-name-'+id);
    if(t&&inp) inp.value=t.name;
  }
}

function switchDetTab(tid, tab, btn) {
  ['subs','note'].forEach(t=>{
    document.getElementById('dp-'+t+'-'+tid)?.classList.toggle('active',t===tab);
  });
  btn.closest('.det-tabs').querySelectorAll('.det-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

/* ═══════════════════════════════════════════
   SUBTASKS
═══════════════════════════════════════════ */
function addSubtask(tid) {
  const inp=document.getElementById('sub-inp-'+tid);
  const val=inp.value.trim(); if(!val) return;
  const t=tasks.find(t=>t.id===tid); if(!t) return;
  if(!t.subtasks) t.subtasks=[];
  t.subtasks.push({name:val,done:false,dueDate:null});
  t.updatedAt=Date.now(); save(); scheduleAutoSync();
  inp.value='';
  // surgical update
  const list=document.getElementById('subs-list-'+tid);
  if(list){
    const si=t.subtasks.length-1;
    const div=document.createElement('div');
    div.className='sub-item'; div.id='sub-'+tid+'-'+si;
    div.innerHTML=`<div class="sub-check" onclick="toggleSub('${tid}',${si})"><svg viewBox="0 0 10 10" fill="none" stroke="white" stroke-width="2"><polyline points="1.5,5 4,7.5 8.5,2.5"/></svg></div><span class="sub-name">${val}</span><button class="sub-del" onclick="deleteSub('${tid}',${si})">×</button>`;
    list.appendChild(div);
  }
  setTimeout(()=>document.getElementById('sub-inp-'+tid)?.focus(),0);
}

function toggleSub(tid,si){
  const t=tasks.find(t=>t.id===tid); if(!t||!t.subtasks) return;
  t.subtasks[si].done=!t.subtasks[si].done; t.updatedAt=Date.now();
  save(); scheduleAutoSync();
  const row=document.getElementById('sub-'+tid+'-'+si);
  if(row){
    row.querySelector('.sub-check')?.classList.toggle('done',t.subtasks[si].done);
    row.querySelector('.sub-name')?.classList.toggle('done',t.subtasks[si].done);
  }
}

function deleteSub(tid,si){
  const t=tasks.find(t=>t.id===tid); if(!t||!t.subtasks) return;
  t.subtasks.splice(si,1); t.updatedAt=Date.now();
  save(); scheduleAutoSync();
  const det=document.getElementById('det-'+tid);
  if(det){
    const list=document.getElementById('subs-list-'+tid);
    if(list){
      list.innerHTML=t.subtasks.map((s,i)=>`<div class="sub-item" id="sub-${tid}-${i}"><div class="sub-check${s.done?' done':''}" onclick="toggleSub('${tid}',${i})"><svg viewBox="0 0 10 10" fill="none" stroke="white" stroke-width="2"><polyline points="1.5,5 4,7.5 8.5,2.5"/></svg></div><span class="sub-name${s.done?' done':''}">${s.name}</span><button class="sub-del" onclick="deleteSub('${tid}',${i})">×</button></div>`).join('');
    }
  }
}

/* ═══════════════════════════════════════════
   QUICK CONTROLS
═══════════════════════════════════════════ */
function closeAllPops() {
  document.querySelectorAll('[id^="pop-"]').forEach(p=>p.innerHTML='');
}

function cycleQcPrio(id, btn) {
  const t=tasks.find(t=>t.id===id); if(!t) return;
  const cycle={urgent:'important',important:'none',none:'urgent'};
  t.priority=cycle[t.priority||'none']; t.updatedAt=Date.now();
  save(); scheduleAutoSync();
  const labels={urgent:'🔴 Pilne',important:'🟢 Ważne',none:'⚪ Pamiętaj'};
  btn.textContent=labels[t.priority];
  btn.className='qc-btn'+(t.priority==='urgent'?' active-urgent':t.priority==='important'?' active-important':'');
  // update chip
  const card=document.getElementById('tc-'+id);
  if(card){
    card.className=card.className.replace(/priority-\w+/g,'').trim();
    if(t.priority==='urgent') card.classList.add('priority-urgent');
    if(t.priority==='important') card.classList.add('priority-important');
    const chips=card.querySelector('.task-chips');
    if(chips){
      chips.querySelector('.chip-urgent')?.remove();
      chips.querySelector('.chip-important')?.remove();
      if(t.priority==='urgent'){const s=document.createElement('span');s.className='chip chip-urgent';s.textContent='Pilne';chips.appendChild(s);}
      if(t.priority==='important'){const s=document.createElement('span');s.className='chip chip-important';s.textContent='Ważne';chips.appendChild(s);}
    }
  }
}

function openDatePop(id, btn) {
  closeAllPops();
  const t=tasks.find(t=>t.id===id); if(!t) return;
  const pop=document.getElementById('pop-'+id);
  if(!pop) return;
  pop.innerHTML=`<div class="popover">
    <div class="pop-title">Data</div>
    <div class="pop-row">
      <button class="pop-btn" onclick="setQcDate('${id}','today')">Dziś</button>
      <button class="pop-btn" onclick="setQcDate('${id}','tomorrow')">Jutro</button>
      <button class="pop-btn" onclick="setQcDate('${id}','week')">Za tydzień</button>
      <button class="pop-btn" onclick="setQcDate('${id}','none')">Usuń</button>
    </div>
    <input type="date" class="pop-inp" value="${t.dueDate||''}" onchange="setQcDate('${id}',this.value)">
    <div class="pop-title" style="margin-top:8px">Typ</div>
    <div class="pop-row">
      <button class="pop-btn ${(t.dateType||'scheduled')==='deadline'?'sel':''}" onclick="setQcDateType('${id}','deadline')">⏰ Do dnia</button>
      <button class="pop-btn ${(t.dateType||'scheduled')==='scheduled'?'sel':''}" onclick="setQcDateType('${id}','scheduled')">📅 Dokładnie</button>
    </div>
    <span class="pop-close" onclick="closeAllPops()">Zamknij ✕</span>
  </div>`;
}

function setQcDate(id, val) {
  const t=tasks.find(t=>t.id===id); if(!t) return;
  if(val==='today') t.dueDate=td();
  else if(val==='tomorrow'){const d=new Date();d.setDate(d.getDate()+1);t.dueDate=d.toISOString().split('T')[0];}
  else if(val==='week'){const d=new Date();d.setDate(d.getDate()+7);t.dueDate=d.toISOString().split('T')[0];}
  else if(val==='none') t.dueDate=null;
  else t.dueDate=val||null;
  t.updatedAt=Date.now(); save(); scheduleAutoSync();
  closeAllPops(); renderAll();
}

function setQcDateType(id, type) {
  const t=tasks.find(t=>t.id===id); if(!t) return;
  t.dateType=type; t.updatedAt=Date.now(); save(); scheduleAutoSync();
  closeAllPops(); renderAll();
}

function openRecurPop(id, btn) {
  closeAllPops();
  const t=tasks.find(t=>t.id===id); if(!t) return;
  const pop=document.getElementById('pop-'+id); if(!pop) return;
  const options=[['none','Brak'],['daily','Codziennie'],['weekdays','Dni robocze'],['weekly','Co tydzień'],['monthly','Co miesiąc']];
  pop.innerHTML=`<div class="popover">
    <div class="pop-title">Powtarzanie</div>
    <div class="pop-row">
      ${options.map(([v,l])=>`<button class="pop-btn ${(t.recur||'none')===v?'sel':''}" onclick="setQcRecur('${id}','${v}')">${l}</button>`).join('')}
    </div>
    <span class="pop-close" onclick="closeAllPops()">Zamknij ✕</span>
  </div>`;
}

function setQcRecur(id, val) {
  const t=tasks.find(t=>t.id===id); if(!t) return;
  if(val!=='none'&&!t.dueDate){alert('Ustaw najpierw datę zadania.');return;}
  t.recur=val; if(val!=='none') t.dateType='scheduled';
  t.updatedAt=Date.now(); save(); scheduleAutoSync();
  closeAllPops(); renderAll();
}

function openBlockPop(id, btn) {
  closeAllPops();
  const t=tasks.find(t=>t.id===id); if(!t) return;
  const pop=document.getElementById('pop-'+id); if(!pop) return;
  // Existing block groups
  const existingGroups=[...new Set(tasks.filter(x=>x.blockGroup).map(x=>x.blockGroup))];
  const meetings_list=meetings.map(m=>m.title);
  const allGroups=[...new Set([...existingGroups,...meetings_list])];

  pop.innerHTML=`<div class="popover">
    <div class="pop-title">Zablokowane przez…</div>
    <div class="pop-row">
      ${allGroups.map(g=>`<button class="pop-btn ${t.blockGroup===g?'sel':''}" onclick="setBlock('${id}','${g.replace(/'/g,"\\'")}')">⏳ ${g}</button>`).join('')}
      <button class="pop-btn" onclick="showNewBlockInp('${id}')">+ Nowe</button>
    </div>
    <div id="new-block-inp-${id}" style="display:none">
      <input type="text" class="pop-inp" id="nbi-${id}" placeholder="Nazwa blokady…" onkeydown="if(event.key==='Enter')setBlockNew('${id}')">

function showNewBlockInp(id) {
  const d=document.getElementById('new-block-inp-'+id);
  if(d){d.style.display='block';document.getElementById('nbi-'+id)?.focus();}
}

function setBlock(id, groupName) {
  const t=tasks.find(t=>t.id===id); if(!t) return;
  t.status='waiting'; t.waitingFor=groupName; t.blockGroup=groupName; t.updatedAt=Date.now();
  save(); scheduleAutoSync(); closeAllPops(); renderAll();
}

function setBlockNew(id) {
  const val=document.getElementById('nbi-'+id)?.value.trim(); if(!val) return;
  setBlock(id, val);
}

/* ═══════════════════════════════════════════
   WANT MORE
═══════════════════════════════════════════ */
function openWantMore() {
  // Show 5 oldest non-done non-blocked non-recurring tasks from backlog
  const today = td();
  const pool = tasks
    .filter(t => {
      if (t.done || t.status === 'waiting' || isRecurring(t)) return false;
      const edd = effectiveDueDate(t);
      if (edd && edd > today) return false; // exclude future-dated tasks
      return true;
    })
    .sort((a,b) => (a.createdAt||0) - (b.createdAt||0))
    .slice(0, 5);

  if (!pool.length) { alert('Backlog jest pusty!'); return; }

  const selected = new Set();

  const overlay = document.createElement('div');
  overlay.className = 'overlay'; overlay.style.display = 'flex';

  const render = () => {
    overlay.innerHTML = `<div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title">Wybierz zadania na dziś</div>
      <div style="font-size:13px;color:var(--text2);margin-bottom:14px">
        Wybierz do 3 zadań z backlogu (wybrano: ${selected.size}/3):
      </div>
      ${pool.map(t => {
        const sel = selected.has(t.id);
        const ep = effectivePriority(t);
        const prioBadge = ep==='urgent'?'<span class="chip chip-urgent" style="font-size:10px">Pilne</span>':ep==='important'?'<span class="chip chip-important" style="font-size:10px">Ważne</span>':'';
        return `<div onclick="wantMoreToggle('${t.id}')" style="display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:.5px solid var(--bd);cursor:pointer">
          <div style="width:22px;height:22px;border-radius:50%;border:1.5px solid ${sel?'var(--sage)':'var(--bd2)'};background:${sel?'var(--sage)':'transparent'};flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s">
            ${sel?'<svg viewBox="0 0 10 10" fill="none" stroke="white" stroke-width="2" width="10" height="10"><polyline points="1.5,5 4,7.5 8.5,2.5"/></svg>':''}
          </div>
          <div style="flex:1;min-width:0">
            <div style="font-size:14px;font-weight:500;color:var(--text);margin-bottom:3px">${t.name}</div>
            <div style="display:flex;gap:4px;flex-wrap:wrap">
              <span class="chip chip-client" style="font-size:10px">${t.client||'–'}</span>
              ${prioBadge}
              ${t.dueDate?`<span class="chip chip-date" style="font-size:10px">${t.dueDate}</span>`:''}
            </div>
          </div>
        </div>`;
      }).join('')}
      <button class="save-btn" style="margin-top:16px" onclick="wantMoreConfirm()">
        Dodaj ${selected.size} zadań do dnia
      </button>
      <button class="tact-btn" style="width:100%;margin-top:8px" onclick="this.closest('.overlay').remove()">Anuluj</button>
    </div>`;
    overlay.onclick = e => { if(e.target===overlay) overlay.remove(); };
    // re-bind toggle
    window._wantMoreOverlay = overlay;
    window._wantMoreSelected = selected;
    window._wantMorePool = pool;
  };

  window.wantMoreToggle = (id) => {
    if (selected.has(id)) { selected.delete(id); }
    else if (selected.size < 3) { selected.add(id); }
    render();
  };

  window.wantMoreConfirm = () => {
    selected.forEach(id => addToToday(id));
    overlay.remove();
  };

  document.body.appendChild(overlay);
  render();
}

function addToToday(id) {
  const t=tasks.find(t=>t.id===id); if(!t) return;
  t.priority='important'; t.updatedAt=Date.now();
  save(); scheduleAutoSync(); renderAll();
}

/* ═══════════════════════════════════════════
   FORM / MODAL
═══════════════════════════════════════════ */
let editId=null, fPrio='none', fRecur='none', fDateType='scheduled';

function setFDateType(dt) {
  fDateType = dt;
  document.getElementById('fdt-scheduled')?.classList.toggle('sel-n', dt==='scheduled');
  document.getElementById('fdt-deadline')?.classList.toggle('sel-n', dt==='deadline');
  document.getElementById('fdt-scheduled')?.classList.toggle('prio-btn', true);
  document.getElementById('fdt-deadline')?.classList.toggle('prio-btn', true);
  const hints = {scheduled:'Pojawi się tylko w ten dzień.', deadline:'Pojawi się od tego dnia i zostaje aż do ukończenia.'};
  const h = document.getElementById('fdt-hint');
  if(h) h.textContent = hints[dt]||'';
}

function openModal(id=null) {
  editId=id; fPrio='none'; fRecur='none'; fDateType='scheduled';
  document.getElementById('sheet-title').textContent=id?'Edytuj zadanie':'Nowe zadanie';
  document.getElementById('save-btn').textContent=id?'Zapisz zmiany':'Dodaj zadanie';
  ['f-name','f-time','f-note'].forEach(i=>{const el=document.getElementById(i);if(el)el.value='';});
  document.getElementById('f-due').value='';
  document.getElementById('more-opts').classList.remove('open');
  setTimeout(()=>setFDateType('scheduled'),0);

  // Populate clients
  const sel=document.getElementById('f-client');
  sel.innerHTML=`<option value="">— wybierz projekt —</option>`+clients.map(c=>`<option value="${c}">${c}</option>`).join('');

  // Set priority buttons
  setPrio('none');
  syncQDbtns();

  // Reset recur
  document.querySelectorAll('#recur-row .recur-btn').forEach(b=>b.classList.toggle('active',b.textContent.trim()==='Brak'));

  if(id){
    const t=tasks.find(t=>t.id===id);
    if(t){
      document.getElementById('f-name').value=t.name||'';
      document.getElementById('f-time').value=t.estTime||'';
      document.getElementById('f-due').value=t.dueDate||'';
      document.getElementById('f-note').value=t.note||'';
      sel.value=t.client||clients[0];
      fPrio=t.priority||'none';
      fDateType=t.dateType||'scheduled';
      setFDateType(fDateType);
      fRecur=t.recur||'none';
      setPrio(fPrio);
      syncQDbtns();
      document.querySelectorAll('#recur-row .recur-btn').forEach(b=>{
        const val=b.onclick?.toString().match(/'(\w+)'/)?.[1];
        if(val) b.classList.toggle('active',val===fRecur);
      });
      if(t.recur&&t.recur!=='none'){document.getElementById('more-opts').classList.add('open');}
    }
  }

  document.getElementById('overlay').classList.add('open');
  setTimeout(()=>document.getElementById('f-name').focus(),120);
}

function closeModal() {
  document.getElementById('overlay').classList.remove('open');
  editId=null;
}

function setPrio(p) {
  fPrio=p;
  const btns={urgent:'pb-urgent',important:'pb-important',none:'pb-none'};
  Object.entries(btns).forEach(([k,id])=>{
    const b=document.getElementById(id);
    if(!b) return;
    b.classList.toggle('sel-u',k==='urgent'&&p==='urgent');
    b.classList.toggle('sel-i',k==='important'&&p==='important');
    b.classList.toggle('sel-n',k==='none'&&p==='none');
  });
}

function setRecur(val, btn) {
  if(val!=='none'&&!document.getElementById('f-due').value){alert('Ustaw najpierw datę zadania.');return;}
  fRecur=val;
  document.querySelectorAll('#recur-row .recur-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

function toggleMore() {
  document.getElementById('more-opts').classList.toggle('open');
}

function setQuickDate(which) {
  const inp=document.getElementById('f-due');
  const d=new Date();
  if(which==='today') inp.value=d.toISOString().split('T')[0];
  else if(which==='tomorrow'){d.setDate(d.getDate()+1);inp.value=d.toISOString().split('T')[0];}
  else if(which==='week'){d.setDate(d.getDate()+7);inp.value=d.toISOString().split('T')[0];}
  else inp.value='';
  syncQDbtns();
}

function syncQDbtns() {
  const val=document.getElementById('f-due')?.value||'';
  const today=td();
  const tomorrow=new Date(Date.now()+86400000).toISOString().split('T')[0];
  const week=new Date(Date.now()+7*86400000).toISOString().split('T')[0];
  document.getElementById('qd-today')?.classList.toggle('active',val===today);
  document.getElementById('qd-tomorrow')?.classList.toggle('active',val===tomorrow);
  document.getElementById('qd-week')?.classList.toggle('active',val===week);
  document.getElementById('qd-none')?.classList.toggle('active',!val);
}

function saveTask() {
  const name=document.getElementById('f-name').value.trim();
  if(!name){alert('Podaj nazwę zadania');return;}
  const client=document.getElementById('f-client').value;
  const dueDate=document.getElementById('f-due').value||null;
  const estTime=parseInt(document.getElementById('f-time').value)||null;
  const note=document.getElementById('f-note').value.trim()||null;

  if(editId){
    const t=tasks.find(t=>t.id===editId);
    if(t){
      Object.assign(t,{name,client,dueDate,estTime,note,priority:fPrio,recur:fRecur,
        dateType:fRecur!=='none'?'scheduled':fDateType,updatedAt:Date.now()});
    }
  } else {
    tasks.push({
      id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),
      name,client,dueDate,estTime,note,
      priority:fPrio,recur:fRecur,
      dateType:fRecur!=='none'?'scheduled':fDateType,
      status:'todo',waitingFor:null,blockGroup:null,
      done:false,subtasks:[],links:[],
      createdAt:Date.now(),updatedAt:Date.now()
    });
  }

  save(); scheduleAutoSync(); closeModal(); renderAll();
}

/* ═══════════════════════════════════════════
   DATA MANAGEMENT
═══════════════════════════════════════════ */
function exportJSON() {
  const data={tasks,clients,clientNotes,meetings,exported:new Date().toISOString()};
  const a=document.createElement('a');
  a.href='data:application/json,'+encodeURIComponent(JSON.stringify(data,null,2));
  a.download='tasks_backup_'+td()+'.json'; a.click();
}

function importJSON(inp) {
  const file=inp.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const d=JSON.parse(e.target.result);
      if(d.tasks){tasks=d.tasks.map(normalizeTask);save();}
      if(d.clients){clients=d.clients;saveCl();}
      if(d.clientNotes){clientNotes=d.clientNotes;saveCN();}
      if(d.meetings){meetings=d.meetings;saveMe();}
      renderAll(); alert('Import zakończony: '+tasks.length+' zadań');
    }catch(err){alert('Błąd importu: '+err.message);}
  };
  reader.readAsText(file);
}

function clearData() {
  if(!confirm('Usunąć wszystkie dane lokalnie?')) return;
  tasks=[]; clients=['Sandoz','AZ','UCB','Recipharm','Veeva','MP','Prywatne'];
  clientNotes={}; meetings=[];
  save(); saveCl(); saveCN(); saveMe(); renderAll();
}

/* ═══════════════════════════════════════════
   NAV
═══════════════════════════════════════════ */
function switchTab(tab, btn) {
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  if(btn) btn.classList.add('active');
  renderAll();
}

/* ═══════════════════════════════════════════
   STARTUP SYNC
═══════════════════════════════════════════ */
setTimeout(async function() {
  if(!gsUrl) return;
  try {
    // Pull from Sheets
    const resp = await fetch(gsUrl + '?action=getAll');
    if(!resp.ok) return;
    const data = await resp.json();
    if(data.error || !Array.isArray(data.tasks)) return;

    const remoteTasks = data.tasks.map(normalizeTask);
    const localMap = Object.fromEntries(tasks.map(t=>[t.id,t]));

    if(tasks.length === 0) {
      tasks = remoteTasks;
    } else {
      const merged = remoteTasks.map(rt=>{
        const local=localMap[rt.id];
        return (local&&(local.updatedAt||0)>=(rt.updatedAt||0)) ? local : rt;
      });
      const remoteIds=new Set(remoteTasks.map(t=>t.id));
      tasks.filter(t=>!remoteIds.has(t.id)).forEach(t=>merged.push(t));
      tasks=merged;
    }

    if(Array.isArray(data.clients)&&data.clients.length>0){clients=data.clients;saveCl();}
    save(); renderAll();

    // Push merged back
    fetch(gsUrl,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'syncAll',tasks,clients})})
      .then(r=>r.json()).then(d=>{
        const ts=new Date().toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'});
        setSyncStatus(d.ok?'✓ '+tasks.length+' zadań · '+ts:'Błąd sync');
      }).catch(()=>{});
  } catch(e) { /* offline */ }
}, 1000);

/* ═══════════════════════════════════════════
   INIT
═══════════════════════════════════════════ */
renderAll();
